<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Product</title>

</head>

<body>

<h1>Add Product</h1>

<form th:action="@{/products/save}"
      th:object="${product}"
      method="post">

    <label>
        Product Name:
    </label>

    <input type="text"
           th:field="*{name}"
           required>

    <br><br>


    <label>
        Description:
    </label>

    <input type="text"
           th:field="*{description}"
           required>

    <br><br>


    <label>
        Price:
    </label>

    <input type="number"
           step="0.01"
           th:field="*{price}"
           required>

    <br><br>


    <label>
        Quantity:
    </label>

    <input type="number"
           th:field="*{quantity}"
           required>

    <br><br>


    <button type="submit">
        Save Product
    </button>

</form>

<br>

<a href="/products">
    Back to Products
</a>

</body>

</html>
